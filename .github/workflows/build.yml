name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Point Godot at the runner's Android SDK and JDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          EOF

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/Privateers.apk
          ls -lh build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Privateers-Android
          path: build/android/Privateers.apk
          if-no-files-found: error

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
